[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
gpui-kit = { version = "0.7", features = ["tree-sitter-yaml"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "ring", "jsonpatch", "http-proxy", "socks5"] }
# Lowest API version k8s-openapi 0.28 supports; the UAT cluster runs v1.29.5.
k8s-openapi = { version = "0.28", features = ["v1_32"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = "1"
# The app's own CPU and memory use for the status bar (spec 0054); already in Cargo.lock through gpui.
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
# Already locked through shellexpand.
dirs = "6"
serde-saphyr = { version = "1.3", default-features = false, features = ["serialize", "deserialize"] }
# The line diff of Edit YAML (spec 0031 decision 20); no dependencies of its own with the default features.
similar = "=3.2.0"
x509-cert = { version = "0.3", default-features = false }
pem = "3"
zeroize = "1"
# Watches a kubeconfig folder (spec 0043); 7.0.0 is already locked through gpui-component.
notify = "7"
flate2 = "1"
base64 = "0.22"
# 1.13.x is already locked through tracing-subscriber env-filter.
regex = "1"
# Rasterizes the Topology SVG export; the same version gpui-pre already builds (no new package).
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
# The terminal engine for pod shells (spec 0036); not on crates.io, so a rev pin is the only reproducible form.
oneterm-vt = { git = "https://github.com/vnStrawHat/OneTerm", rev = "e2f9c24bc747b26dbfe0e338e66f1c41a3ac30d8", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.dev]
codegen-units = 16
debug = "line-tables-only"

# GPUI is slow when unoptimized.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
