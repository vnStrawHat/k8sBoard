# lab-quota: a namespace whose quota is nearly full on limits.memory (not one of the three columns
# the list shows by default), with a LimitRange and a NetworkPolicy.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: lab-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.memory: 640Mi
    pods: "10"
    services: "3"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: lab-quota
spec:
  limits:
    - type: Container
      default: { cpu: 100m, memory: 128Mi }
      defaultRequest: { cpu: 20m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filler
  namespace: lab-quota
spec:
  replicas: 4
  selector:
    matchLabels:
      app: filler
  template:
    metadata:
      labels:
        app: filler
    spec:
      containers:
        - name: app
          image: __BUSYBOX__
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 150Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: lab-quota
spec:
  podSelector:
    matchLabels:
      app: filler
  policyTypes: [Ingress]
  ingress: []
