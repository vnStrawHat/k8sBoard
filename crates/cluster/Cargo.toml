[package]
name = "k8sboard-cluster"
description = "Kubeconfig loading, context selection, and cluster access with one allow-listed write path for k8sBoard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cluster"

[dependencies]
# `ws` brings the exec and port-forward transports (specs 0035, 0036).
kube = { workspace = true, features = ["ws"] }
k8s-openapi.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
x509-cert.workspace = true
pem.workspace = true
zeroize.workspace = true
flate2.workspace = true
base64.workspace = true
# `http` types the proxy URL; already in Cargo.lock.
http = "1"
# The metrics source query string and its capped body read (spec 0048); both already in Cargo.lock.
form_urlencoded = "1"
http-body-util = "0.1"
# The traffic counting layer (spec 0054) and the fake transport; already in Cargo.lock.
tower = { version = "0.5", default-features = false, features = ["util"] }
# The body size hint of a request (spec 0054); already in Cargo.lock.
http-body = "1"
hotpath = { workspace = true, optional = true }

[features]
# Measured sites for `hotpath` (spec 0055); only `k8sboard`'s `hotpath-profiling` turns measuring on.
hotpath-profiling = ["dep:hotpath"]
# Set by the app's screenshot build: every connection refuses writes, whatever the environment says.
block-writes = []
# A fake API server for the tests of other crates. Never enabled by a build of the app itself.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
