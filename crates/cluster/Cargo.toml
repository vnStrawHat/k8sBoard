[package]
name = "k8sboard-cluster"
description = "Kubeconfig loading, context selection, and cluster access with one allow-listed write path for k8sBoard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cluster"

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
x509-cert.workspace = true
pem.workspace = true
zeroize.workspace = true
flate2.workspace = true
base64.workspace = true

[features]
# Set by the app's screenshot build: every connection refuses writes, whatever the environment says.
block-writes = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The fake transport behind `fake_api`; both are already in Cargo.lock.
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"

[lints]
workspace = true
