[package]
name = "k8sboard"
description = "k8sBoard desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "k8sboard"
path = "src/main.rs"

[features]
# Dev-only: lets `--screenshot` render a window to a PNG. Never a default feature.
screenshot = ["gpui-kit/test-support"]

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
futures.workspace = true
jiff.workspace = true
k8sboard-cluster = { path = "../cluster" }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[dev-dependencies]
# Headless windows for the key binding tests; `screenshot` already enables the same feature.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
